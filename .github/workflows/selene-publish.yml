name: publish-extension

on: workflow_dispatch

permissions:
  contents: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        working-directory: sdks/vscode
        run: bun install
      - name: Publicar no Marketplace (OIDC)
        working-directory: sdks/vscode
        run: npx --yes @vscode/vsce publish --oidc
      - name: Mostrar versao publicada
        working-directory: sdks/vscode
        run: node -p "'publicado: ' + require('./package.json').version"
