# Caminhos que o GitHub pode ignorar na varredura de segredos.
# Motivo: estes diretórios só têm GRAVAÇÕES DE TESTE (respostas HTTP salvas),
# com chaves falsas/expiradas usadas para validar o próprio código.
# Ver FORK.md.
paths-ignore:
  - "packages/ai/test/fixtures/**"
  - "packages/http-recorder/test/**"
  - "**/test/**/*.test.ts"
  - "**/*.test.ts"
